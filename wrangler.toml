name = "donut-bites"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[[kv_namespaces]]
binding = "SITE_CONTENT"
id = "07088921913d4375a97ae22ac225ff6f"

# El binding de R2 (SITE_IMAGES -> donut-bites-images) se configura desde el
# dashboard de Cloudflare (Settings > Bindings), no aqui. Declararlo tambien
# en wrangler.toml hace que el despliegue falle: la funcion de bindings de R2
# via wrangler.toml para Pages esta marcada "(BETA)" por Cloudflare y en la
# practica no resuelve el bucket ("R2 bucket 'donut-bites-images' not found"),
# aunque el mismo bucket si funciona bien configurado desde el dashboard.
